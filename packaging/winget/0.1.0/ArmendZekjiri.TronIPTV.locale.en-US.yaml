ShortDescription: A fast, modern, open-source IPTV player for Windows.
Description: |-
  TronIPTV plays Xtream Codes, M3U/M3U8 and local M3U playlists with an XMLTV TV guide, a poster grid for movies and series, favorites and recently watched lists.
  Playback uses libVLC with hardware decoding. Libraries are saved locally for instant startup, and stored secrets are encrypted with Windows DPAPI. No telemetry.
  TronIPTV is a media player only; it does not provide any channels, streams or playlists.
