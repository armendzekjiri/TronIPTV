name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer computes the version from tags and history

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore TronIPTV.sln

      - name: Build
        run: dotnet build TronIPTV.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test TronIPTV.sln --configuration Release --no-build
          --logger trx --results-directory artifacts/test-results
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 14

      - name: Publish (win-x64, self-contained)
        run: >
          dotnet publish src/TronIPTV/TronIPTV.csproj --configuration Release
          --runtime win-x64 --self-contained --output artifacts/publish

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: TronIPTV-win-x64-${{ github.sha }}
          path: artifacts/publish
          retention-days: 14
